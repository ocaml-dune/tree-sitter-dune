name: Fuzz Parser

on:
  push:
    branches: [main, master]
    paths:
      - grammar.js
      - src/parser.c
  pull_request:
    paths:
      - grammar.js
      - src/parser.c
  workflow_dispatch:

concurrency:
  group: ${{github.workflow}}-${{github.ref}}
  cancel-in-progress: true

jobs:
  fuzz:
    name: Fuzz
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Retrieve Tree Sitter version info
        id: versions
        run: |
          ABI_VERSION=$(make abi-version)
          CLI_VERSION=$(make cli-version)
          echo "abi=$ABI_VERSION" >> "$GITHUB_OUTPUT"
          echo "cli=$CLI_VERSION" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Fuzz parser
        uses: tree-sitter/fuzz-action@v4
        with:
          language: dune
          tree-sitter-version: ${{ steps.versions.outputs.cli }}

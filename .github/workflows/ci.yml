name: CI

on:
  push:
    branches: [main, master]
    paths:
      - grammar.js
      - src/**
      - test/**
      - bindings/**
      - binding.gyp
      - .github/workflows/ci.yml
  pull_request:
    paths:
      - grammar.js
      - src/**
      - test/**
      - bindings/**
      - binding.gyp
      - .github/workflows/ci.yml
  workflow_dispatch:

concurrency:
  group: ${{github.workflow}}-${{github.ref}}
  cancel-in-progress: true

env:
  # Keep in sync with TREE_SITTER_VERSION in fuzz.yml.
  TREE_SITTER_VERSION: v0.27.0

jobs:
  versions:
    runs-on: ubuntu-slim
    outputs:
      abi: ${{ steps.versions.outputs.abi }}
      cli: ${{ steps.versions.outputs.cli }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Retrieve Tree Sitter version info
        id: versions
        run: |
          ABI_VERSION=$(make abi-version)
          CLI_VERSION=$(make cli-version)
          echo "abi=$ABI_VERSION" >> "$GITHUB_OUTPUT"
          echo "cli=$CLI_VERSION" >> "$GITHUB_OUTPUT"
        shell: bash

  test:
    name: Test Parser
    needs: versions
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-14
          - windows-2022 # newer windows requires newer node requires newer ABI
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up tree-sitter
        uses: tree-sitter/setup-action/cli@v2
        with:
          tree-sitter-ref: ${{ needs.versions.outputs.cli }}

      - name: Run parser tests
        uses: tree-sitter/parser-test-action@v3
        with:
          generate: true
          abi-version: ${{ needs.versions.outputs.abi }}
          node-version: '20'
          test-rust: ${{runner.os == 'Linux'}}
          test-node: true
          test-python: false
          test-go: true
          test-swift: false

  parse-examples:
    name: Parse Examples
    needs: versions
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up tree-sitter
        uses: tree-sitter/setup-action/cli@v2
        with:
          tree-sitter-ref: ${{ needs.versions.outputs.cli }}

      - name: Generate parser
        run: make generate

      - name: Parse example files
        uses: tree-sitter/parse-action@v4
        with:
          files: test/files.txt

  check-queries:
    name: Check Queries
    needs: versions
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up tree-sitter
        uses: tree-sitter/setup-action/cli@v2
        with:
          tree-sitter-ref: ${{ needs.versions.outputs.cli }}

      - name: Generate parser
        run: make generate

      - name: Test highlight queries
        run: tree-sitter highlight queries/highlights.scm --check

      - name: Test injection queries
        run: tree-sitter highlight queries/injections.scm --check || true
